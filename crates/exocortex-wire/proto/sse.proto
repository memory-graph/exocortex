syntax = "proto3";
package exocortex.sse.v1;
message Invalidation {
  oneof kind {
    MemoryUpserted      memory_upserted      = 1;
    MemoryDeleted       memory_deleted       = 2;
    RelationshipUpserted relationship_upserted = 3;
    RelationshipDeleted  relationship_deleted  = 4;
    VisibilityAdvance    visibility_advance     = 5;
    GraphReseed          graph_reseed           = 6;
    DiscoveryAvailable   discovery_available    = 7;
  }
  uint64 backend_lsn = 10;
}
message MemoryUpserted      { bytes id = 1; bytes snapshot_json = 2; }
message MemoryDeleted       { bytes id = 1; }
message RelationshipUpserted { bytes id = 1; bytes from = 2; bytes to = 3; uint32 kind = 4; bytes snapshot_json = 5; }
message RelationshipDeleted  { bytes id = 1; }
// Identifier-free replacement for a change hidden from this subscriber.
// It advances the signed backend LSN without revealing the hidden row.
message VisibilityAdvance {}
// Complete caller-visible cache image used for initial hydration and recovery.
message GraphReseed { bytes snapshot_json = 1; }
// Newly persisted structured proposal. The SSE boundary removes this event
// for subscribers that cannot see both endpoints.
message DiscoveryAvailable { bytes record_json = 1; }
