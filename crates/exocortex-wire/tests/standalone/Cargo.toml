# A consumer crate whose ONLY exocortex dependency is exocortex-wire
# (PRD R2). Built by `cargo xtask wire-standalone` against the PACKAGED
# wire tarball, proving registry consumers can use it standalone.
[package]
name = "wire-standalone-fixture"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
exocortex-wire = { path = "../exocortex-wire" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
