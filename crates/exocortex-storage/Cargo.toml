# crates/exocortex-storage/Cargo.toml
[package]
name    = "exocortex-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Exocortex storage seam: the Storage trait, the registered Cypher catalogue, the FalkorDB adapter, and the in-memory test double."

[dependencies]
exocortex-kernel = { workspace = true }
async-trait = { workspace = true }
falkordb = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smol_str = { workspace = true }
futures = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
once_cell = { workspace = true }
chrono = { workspace = true }
smallvec = { workspace = true }
redis = { workspace = true }

[features]
integration = []
testing = []

[dev-dependencies]
exocortex-kernel = { workspace = true }
exocortex-pack-dev-v1 = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
smol_str = { workspace = true }
