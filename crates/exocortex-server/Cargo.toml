# crates/exocortex-server/Cargo.toml
[package]
name    = "exocortex-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Exocortex node binary: mcp-standalone and backend-node modes over one listener (gRPC + HTTP + SSE) with gossip and lease re-election."

[features]
fastembed = ["exocortex-ingest/fastembed"]
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:metrics-exporter-opentelemetry",
    "dep:metrics-util",
]

[lib]
name = "exocortex_server"
path = "src/lib.rs"

[[bin]]
name = "exocortex-node"
path = "src/main.rs"

[dependencies]
# D21-b: the registry preflight handle implements the ops async trait.
async-trait = { workspace = true }
exocortex-kernel = { workspace = true }
exocortex-storage = { workspace = true }
exocortex-cache = { workspace = true }
exocortex-reasoning = { workspace = true }
exocortex-cluster = { workspace = true }
exocortex-ingest = { workspace = true }
exocortex-ops = { workspace = true }
exocortex-dreams = { workspace = true }
exocortex-wire = { workspace = true }
exocortex-pack-dev-v1 = { workspace = true }
# PX2: the second pack links in so its verbs ride the one registry.
exocortex-pack-mortgage-v1 = { workspace = true }
exocortex-pack-study-v1 = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }
rustls = { workspace = true }
rmcp = { workspace = true }
prost = { workspace = true }
async-stream = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
tower = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
# D6 (R-O3): opt-in OTLP metric export. Default builds keep the exact
# dependency surface they had; operators pointing a collector at the
# node build with `--features otlp` and set OTEL_EXPORTER_OTLP_ENDPOINT.
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
metrics-exporter-opentelemetry = { workspace = true, optional = true }
metrics-util = { workspace = true, optional = true }

arc-swap = { workspace = true }
serde = { workspace = true }
chitchat = { workspace = true }
tonic = { workspace = true }
http = { workspace = true }
redis = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
exocortex-storage = { workspace = true, features = ["testing"] }
exocortex-adapter-sdk = { workspace = true }
tempfile = "3"
exocortex-client = { workspace = true }
exocortex-cache = { workspace = true }
chitchat = { workspace = true }
