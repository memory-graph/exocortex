# crates/exocortex-server/Cargo.toml
[package]
name    = "exocortex-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Exocortex node binary: mcp-standalone and backend-node modes over one listener (gRPC + HTTP + SSE) with gossip and lease re-election."

[features]
fastembed = ["exocortex-ingest/fastembed"]

[lib]
name = "exocortex_server"
path = "src/lib.rs"

[[bin]]
name = "exocortex-node"
path = "src/main.rs"

[dependencies]
exocortex-kernel = { workspace = true }
exocortex-storage = { workspace = true }
exocortex-cache = { workspace = true }
exocortex-reasoning = { workspace = true }
exocortex-cluster = { workspace = true }
exocortex-ingest = { workspace = true }
exocortex-ops = { workspace = true }
exocortex-dreams = { workspace = true }
exocortex-wire = { workspace = true }
exocortex-pack-dev-v1 = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }
rustls = { workspace = true }
rmcp = { workspace = true }
prost = { workspace = true }
async-stream = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
arc-swap = { workspace = true }
serde = { workspace = true }
chitchat = { workspace = true }
tonic = { workspace = true }
http = { workspace = true }
redis = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
exocortex-storage = { workspace = true, features = ["testing"] }
exocortex-adapter-sdk = { workspace = true }
tempfile = "3"
exocortex-client = { workspace = true }
exocortex-cache = { workspace = true }
prost-types = { workspace = true }
chitchat = { workspace = true }
