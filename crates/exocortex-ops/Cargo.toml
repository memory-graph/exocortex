# crates/exocortex-ops/Cargo.toml
[package]
name    = "exocortex-ops"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Exocortex operation registry: typed actions registered once and served identically over MCP and HTTP, with schema goldens and the audit ledger."

[dependencies]
metrics = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
smol_str = { workspace = true }
smallvec = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
http = { workspace = true }
# D21-b: `preflight_batch` constructs wire batch timestamps (the mirror
# of `MemoryDraft.valid_from`); the type is already the workspace pin.
prost-types = { workspace = true }
serde_json = { workspace = true }
exocortex-kernel = { workspace = true }
exocortex-wire = { workspace = true }
exocortex-storage = { workspace = true }
exocortex-cache = { workspace = true }
exocortex-reasoning = { workspace = true }
schemars = { workspace = true }
inventory = { workspace = true }
rmcp = { workspace = true }
# PX2: pack-Function scheme bodies execute in the embedded Steel
# interpreter. JSON is native at this operation boundary (CR-8 keeps the
# reasoning crate's rule path serialization-free, so the evaluator lives
# here).
steel-core = { workspace = true }

[dev-dependencies]
exocortex-pack-dev-v1 = { workspace = true }
exocortex-pack-mortgage-v1 = { workspace = true }
exocortex-pack-study-v1 = { workspace = true }
exocortex-reasoning = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[[bench]]
name = "pack_functions"
harness = false
