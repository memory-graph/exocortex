[package]
name    = "exocortex-adapter-iceberg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Iceberg-table adapter (D1, iceberg flavor): a local Iceberg table's current snapshot as a bounded, declared-projection import through the signed Ingestion Protocol. Reads the Iceberg format directly (metadata.json + Avro manifests + Parquet data) — no catalog, no engine, no LLM, no network beyond the backend."

[[bin]]
name = "exocortex-adapter-iceberg"
path = "src/main.rs"

[dependencies]
exocortex-adapter-sdk = { workspace = true }
exocortex-adapter-table = { workspace = true }
exocortex-wire = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
arrow-array = { workspace = true }
arrow-cast = { workspace = true }
arrow-schema = { workspace = true }
parquet = { workspace = true }
apache-avro = { workspace = true }
flate2 = { workspace = true }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
exocortex-adapter-sdk = { workspace = true, features = ["testing"] }
tempfile = "3"
