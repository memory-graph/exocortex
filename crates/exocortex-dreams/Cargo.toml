# crates/exocortex-dreams/Cargo.toml
[package]
name    = "exocortex-dreams"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Exocortex consolidation engine: MCR-squared rate reduction, graph-sparsity guardrails, rollback, and structured discovery proposals."

[lib]
name = "exocortex_dreams"
path = "src/lib.rs"

[dependencies]

exocortex-kernel = { workspace = true }
exocortex-storage = { workspace = true }
exocortex-wire = { workspace = true }
exocortex-pack-dev-v1 = { workspace = true }
redis = { workspace = true }
metrics = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
smol_str = { workspace = true }
uuid = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
integration = []
testing = ["exocortex-storage/testing"]

[dev-dependencies]
exocortex-dreams = { path = ".", features = ["testing"] }
exocortex-pack-dev-v1 = { workspace = true }
futures = { workspace = true }
