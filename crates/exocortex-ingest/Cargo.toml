# crates/exocortex-ingest/Cargo.toml
[package]
name    = "exocortex-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Exocortex ingestion service: HMAC-authenticated batches through fingerprint, ceiling, and triple validation, with server-side entity extraction and embeddings."

[lib]
name = "exocortex_ingest"
path = "src/lib.rs"

[dependencies]

exocortex-kernel = { workspace = true }
exocortex-wire = { workspace = true }
exocortex-storage = { workspace = true }
exocortex-cache = { workspace = true }
exocortex-reasoning = { workspace = true }
exocortex-dreams = { workspace = true }
tonic = { workspace = true }
tokio-stream = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smol_str = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
once_cell = { workspace = true }
regex = { workspace = true }
lasso = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
exocortex-pack-dev-v1 = { workspace = true }
metrics = { workspace = true }
lru = { workspace = true }
fastembed = { workspace = true, optional = true }

[features]
# Production embedding backend (bge-small via fastembed/ort). Off by default
# so builds and CI do not fetch the ONNX runtime; backend deployments enable
# it (§16 embedding backend default).
fastembed = ["dep:fastembed"]

[dev-dependencies]
exocortex-client = { workspace = true }
blake3 = { workspace = true }
prost = { workspace = true }
exocortex-pack-dev-v1 = { workspace = true }
futures = { workspace = true }
exocortex-reasoning = { workspace = true }
