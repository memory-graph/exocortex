# crates/exocortex-kernel/Cargo.toml
[package]
name    = "exocortex-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Ontology kernel for Exocortex: memory/relationship types, provenance, visibility, validators, and the deterministic fingerprint. Zero I/O."

[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
bincode     = { workspace = true }
schemars    = { workspace = true }
smol_str    = { workspace = true }
smallvec    = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
chrono      = { workspace = true }
uuid        = { workspace = true }
blake3      = { workspace = true }
sha2        = { workspace = true }
inventory   = { workspace = true }
lasso       = { workspace = true }
crepe       = { workspace = true }

[features]
default = []
# no default features; the kernel does zero I/O

[dev-dependencies]
smallvec   = { workspace = true }
smol_str   = { workspace = true }
serde_json = { workspace = true }
chrono     = { workspace = true }
