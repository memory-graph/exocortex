# crates/exocortex-cache/Cargo.toml
[package]
name    = "exocortex-cache"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Exocortex local read path: ArcSwap lock-free snapshots, 2Q admission, and zero-allocation search/traverse over the org graph."

[dependencies]
exocortex-kernel = { workspace = true }
exocortex-storage = { workspace = true }
arc-swap = { workspace = true }
metrics = { workspace = true }
dashmap = { workspace = true }
petgraph = { workspace = true }
roaring = { workspace = true }
lasso = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
lru = { workspace = true }
smallvec = { workspace = true }
smol_str = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
exocortex-pack-dev-v1 = { workspace = true }
stats_alloc = "0.1"  # §8.5 step 1: no-allocation assertion on the read hot path

[[bench]]
name = "search"
harness = false

[[bench]]
name = "updates"
harness = false
