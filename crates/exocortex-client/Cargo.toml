# crates/exocortex-client/Cargo.toml
[package]
name    = "exocortex-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Exocortex MCP client: local cache, WAL offline capture, the session-wrapup tool, and the reconnecting SSE subscriber."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
inventory = { workspace = true }
http = { workspace = true }
blake3 = { workspace = true }
bincode = { workspace = true}
anyhow = { workspace = true }
thiserror = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
smol_str = { workspace = true }
tokio = { workspace = true }
clap = { version = "4", features = ["derive"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
exocortex-pack-dev-v1 = { workspace = true }
exocortex-kernel = { workspace = true }
exocortex-wire = { workspace = true }
tonic = { workspace = true }
async-stream = { workspace = true }
exocortex-cache = { workspace = true }
exocortex-storage = { workspace = true } # IN10: registry dispatch needs the Storage trait
exocortex-reasoning = { workspace = true }
exocortex-ops = { workspace = true }
exocortex-adapter-sdk = { workspace = true }  # W1: reuse the R13 classify table, not a second copy
rmcp = { workspace = true }
sled = { workspace = true }
hyper = { workspace = true }
hyper-rustls = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
metrics = { workspace = true }

[[bin]]
name = "exocortex-mcp-client"
path = "src/main.rs"

[dev-dependencies]
exocortex-ingest = { workspace = true }
tonic = { workspace = true }
exocortex-cluster = { workspace = true }
exocortex-server = { workspace = true }
axum = { workspace = true }
prost = { workspace = true }
