name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The exact pin from rust-toolchain.toml: stable's rustfmt has
      # drifted, so the runner must format with the same version the
      # code was written against.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.85.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install protoc (prost build scripts)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: taiki-e/install-action@d865e9aac326f15b06ac52b57abb58cd0e3330e4 # cargo-deny
      - name: Mandatory correctness prerequisite
        run: bash scripts/verify-release.sh
        env:
          # Shared runners steal CPU. The factor still rejects a 2x regression.
          SLO_MULTIPLIER: "2"
      - name: Publish-script disposable fixture
        run: bash scripts/tests/publish.sh
