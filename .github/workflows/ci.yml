name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The exact pin from rust-toolchain.toml: stable's rustfmt has
      # drifted, so the runner must format with the same version the
      # code was written against.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.85.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (prost build scripts)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Deny (licenses, advisories, bans)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace
      - name: Tests (SDK integration suites on via workspace feature)
        run: cargo test --workspace --features exocortex-adapter-sdk/testing
      - name: Kernel purity (R-I1/CR-26)
        run: cargo xtask kernel-purity
      - name: Fingerprint stability (R-T21)
        run: |
          a=$(cargo xtask fingerprint)
          b=$(cargo xtask fingerprint)
          [ "$a" = "$b" ] && echo "fingerprint stable: $a"
      - name: Schema drift (M7 goldens)
        run: cargo xtask gen-schemas
      - name: playbook drift gate
        run: cargo xtask gen-playbook
      - name: No LLM (R-D6/CR-19)
        run: cargo xtask no-llm
      - name: Proto sync (vendored wire protos)
        run: cargo xtask proto-sync
      - name: Wire standalone (packaged-tarball consumer)
        run: cargo xtask wire-standalone
      - name: Signing hygiene (single batch-signing impl)
        run: cargo xtask signing-hygiene
      - name: Metrics hygiene (bounded labels)
        run: cargo xtask metrics-hygiene
      - name: SLO benches (R-Lat1; fail on regression)
        # Shared runners steal CPU; the budgets assume dedicated hardware.
        # x2 keeps the gate meaningful (a 2x regression still fails) while
        # absorbing runner noise. Local runs use the bare budgets.
        run: cargo xtask bench
        env:
          SLO_MULTIPLIER: "2"
