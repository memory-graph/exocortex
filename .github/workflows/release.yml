# Release pipeline: cross-platform binaries + installer scripts.
#
# On tag push (v*), builds the user-facing binaries for each target
# platform, packages them with sha256 checksums, attaches everything to
# the GitHub Release, and updates the auto-generated install.sh /
# install.ps1 so users can install without a Rust toolchain or protoc:
#
#   curl --proto '=https' --tlsv1.2 -LsSf \
#     https://github.com/memory-graph/exocortex/releases/latest/download/install.sh | sh
#
# Targets are chosen for the MCP-client audience: macOS arm64/x64 and
# Linux x64 (glibc, static-ish via the release profile). The exocortex-node
# and exocortex-worker binaries ship alongside exocortex-mcp-client so
# team/backend mode installs the same way.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.85.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install checksum-verified protoc
        run: |
          bash scripts/install-protoc.sh "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@d865e9aac326f15b06ac52b57abb58cd0e3330e4 # cargo-deny
      - name: Tag matches coherent workspace version
        run: |
          version=$(cargo metadata --format-version 1 --no-deps | python3 -c '
          import json, sys
          versions = {p["version"] for p in json.load(sys.stdin)["packages"] if p["name"].startswith("exocortex-")}
          if len(versions) != 1: raise SystemExit("mixed Exocortex package versions")
          print(versions.pop())
          ')
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Mandatory correctness prerequisite
        run: bash scripts/verify-release.sh
        env:
          SLO_MULTIPLIER: "2"
      - name: Publish-script disposable fixture
        run: bash scripts/tests/publish.sh

  # Build matrix: one job per target.
  build:
    needs: correctness
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            standalone: true
          # FalkorDB publishes no macOS-x64 embedded runtime. Keep the
          # client/team binaries on GitHub's native Intel runner, but do not
          # misrepresent this artifact as self-contained standalone.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            standalone: false
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            standalone: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.85.0"
          targets: ${{ matrix.target }}
      - name: Install checksum-verified protoc
        run: |
          bash scripts/install-protoc.sh "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: |
          cargo build --release --target ${{ matrix.target }} \
            -p exocortex-client -p exocortex-server -p exocortex-worker \
            --features exocortex-server/fastembed

      - name: Package
        id: package
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          DIST="exocortex-$TAG-${{ matrix.target }}"
          mkdir -p "dist/$DIST"
          for bin in exocortex-mcp-client exocortex-node exocortex-worker; do
            cp "target/${{ matrix.target }}/release/$bin" "dist/$DIST/"
          done
          if [ "${{ matrix.standalone }}" = true ]; then
            bash scripts/fetch-standalone-runtime.sh \
              "dist/$DIST/standalone-runtime" "${{ matrix.target }}"
          fi
          sh scripts/fetch-embedding-model.sh "dist/$DIST/models"
          mkdir -p "dist/install-probe/bin" "dist/install-probe/share/exocortex"
          cp "dist/$DIST/exocortex-node" "dist/install-probe/bin/"
          cp -R "dist/$DIST/models" "dist/install-probe/share/exocortex/"
          env -u EXOCORTEX_BGE_SMALL_MODEL_DIR \
            "dist/install-probe/bin/exocortex-node" --verify-embedder
          rm -rf "dist/install-probe"
          cp scripts/exocortex "dist/$DIST/exocortex"
          cp README.md LICENSE "dist/$DIST/"
          if [ "${{ matrix.standalone }}" = true ]; then
            model_dir=$(find "dist/$DIST/models" -mindepth 1 -maxdepth 1 -type d | head -1)
            EXOCORTEX_BIN_DIR="dist/$DIST" \
              EXOCORTEX_WRAPPER="dist/$DIST/exocortex" \
              EXOCORTEX_BGE_SMALL_MODEL_DIR="$model_dir" \
              sh scripts/test-standalone-live.sh
          fi
          cat > "dist/$DIST/README-install.txt" <<EOF
          Exocortex $TAG (${{ matrix.target }})

          Binaries:
            exocortex             one entrypoint (supported modes below)
            exocortex-mcp-client  MCP client (offline buffer or external backend)
            exocortex-node        backend node (team/org mode)
            exocortex-worker      adapter host (external sources)

          Add this directory to PATH (e.g. ~/.local/bin or /usr/local/bin).
          EOF
          if [ "${{ matrix.standalone }}" = true ]; then
            cat >> "dist/$DIST/README-install.txt" <<EOF

          Supported modes: mcp-client, mcp-standalone, backend-node.
          This artifact includes the verified Redis/Falkor runtime. Start with:
            exocortex --mode mcp-standalone --org my-org --user me
          EOF
          else
            cat >> "dist/$DIST/README-install.txt" <<EOF

          Supported modes: mcp-client, backend-node.
          mcp-standalone is unavailable in this macOS Intel artifact because
          upstream FalkorDB publishes embedded runtimes only for Linux x64 and
          macOS arm64. Client and backend-node modes remain supported.
          EOF
          fi
          cd dist
          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            tar -czf "$DIST.tar.gz" "$DIST"
          fi
          # Portable checksum: macOS has shasum, Linux has sha256sum.
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$DIST.tar.gz" > "$DIST.tar.gz.sha256"
          else
            sha256sum "$DIST.tar.gz" > "$DIST.tar.gz.sha256"
          fi
          echo "archive=dist/$DIST.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/$DIST.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          echo "dirname=$DIST" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.dirname }}
          path: dist/*

  # Installer scripts + final release assembly.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate installers
        run: |
          cp scripts/release-install.sh dist/install.sh
          chmod +x dist/install.sh
      - name: Create/attach release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          bash scripts/publish-release-assets.sh "$TAG" "$GITHUB_REPOSITORY" dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers
          path: dist/install.sh
