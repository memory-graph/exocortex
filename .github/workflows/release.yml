# Release pipeline: cross-platform binaries + installer scripts.
#
# On tag push (v*), builds the user-facing binaries for each target
# platform, packages them with sha256 checksums, attaches everything to
# the GitHub Release, and updates the auto-generated install.sh /
# install.ps1 so users can install without a Rust toolchain or protoc:
#
#   curl --proto '=https' --tlsv1.2 -LsSf \
#     https://github.com/memory-graph/exocortex/releases/latest/download/install.sh | sh
#
# Targets are chosen for the MCP-client audience: macOS arm64/x64 and
# Linux x64 (glibc, static-ish via the release profile). The exocortex-node
# and exocortex-worker binaries ship alongside exocortex-mcp-client so
# team/backend mode installs the same way.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.85.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: taiki-e/install-action@cargo-deny
      - name: Tag matches coherent workspace version
        run: |
          version=$(cargo metadata --format-version 1 --no-deps | python3 -c '
          import json, sys
          versions = {p["version"] for p in json.load(sys.stdin)["packages"] if p["name"].startswith("exocortex-")}
          if len(versions) != 1: raise SystemExit("mixed Exocortex package versions")
          print(versions.pop())
          ')
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Mandatory correctness prerequisite
        run: bash scripts/verify-release.sh
        env:
          SLO_MULTIPLIER: "2"
      - name: Publish-script disposable fixture
        run: bash scripts/tests/publish.sh

  # Build matrix: one job per target.
  build:
    needs: correctness
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Apple targets build on macos-14 (arm64): rustc
          # cross-compiles x86_64-apple-darwin natively there. The
          # dedicated macos-13 (Intel) runners are being deprecated and
          # queue for an hour+, which would stall every release.
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.85.0"
          targets: ${{ matrix.target }}
      - name: Install protoc (Linux builds)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - name: Install protoc (macOS builds)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: |
          cargo build --release --target ${{ matrix.target }} \
            -p exocortex-client -p exocortex-server -p exocortex-worker

      - name: Package
        id: package
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          DIST="exocortex-$TAG-${{ matrix.target }}"
          mkdir -p "dist/$DIST"
          for bin in exocortex-mcp-client exocortex-node exocortex-worker; do
            cp "target/${{ matrix.target }}/release/$bin" "dist/$DIST/"
          done
          cp scripts/exocortex "dist/$DIST/exocortex"
          cp README.md LICENSE "dist/$DIST/"
          cat > "dist/$DIST/README-install.txt" <<EOF
          Exocortex $TAG (${{ matrix.target }})

          Binaries:
            exocortex             one entrypoint: --mode mcp-client|mcp-standalone|backend-node
            exocortex-mcp-client  local MCP server (personal quickstart — see README)
            exocortex-node        backend node (team/org mode)
            exocortex-worker      adapter host (external sources)

          Add to PATH (e.g. ~/.local/bin or /usr/local/bin) and run:
            exocortex-mcp-client --org my-org --user me
          EOF
          cd dist
          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            tar -czf "$DIST.tar.gz" "$DIST"
          fi
          # Portable checksum: macOS has shasum, Linux has sha256sum.
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$DIST.tar.gz" > "$DIST.tar.gz.sha256"
          else
            sha256sum "$DIST.tar.gz" > "$DIST.tar.gz.sha256"
          fi
          echo "archive=dist/$DIST.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/$DIST.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          echo "dirname=$DIST" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.dirname }}
          path: dist/*

  # Installer scripts + final release assembly.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate installers
        run: |
          REPO="memory-graph/exocortex"
          TAG="${GITHUB_REF_NAME}"
          cat > dist/install.sh <<'EOF'
          #!/bin/sh
          # Exocortex installer (generated by the Release workflow).
          # Usage: curl -LsSf https://github.com/memory-graph/exocortex/releases/latest/download/install.sh | sh
          set -eu
          repo="memory-graph/exocortex"
          tag="${INSTALL_VERSION:-latest}"
          [ "$tag" = "latest" ] && tag=$(curl -fsSL "https://api.github.com/repos/$repo/releases/latest" | grep -o '"tag_name": *"[^"]*"' | head -1 | cut -d'"' -f4)
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64)  target="aarch64-apple-darwin" ;;
            Darwin-x86_64) target="x86_64-apple-darwin" ;;
            Linux-x86_64)  target="x86_64-unknown-linux-gnu" ;;
            *) echo "unsupported platform: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          url="https://github.com/$repo/releases/download/$tag/exocortex-${tag#v}-$target.tar.gz"
          tmp="$(mktemp -d)"
          echo "downloading $url"
          curl -fsSL "$url" -o "$tmp/exo.tar.gz"
          tar -xzf "$tmp/exo.tar.gz" -C "$tmp"
          src="$(find "$tmp" -maxdepth 2 -name exocortex-mcp-client -exec dirname {} \; | head -1)"
          dest="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "$dest"
          for bin in exocortex exocortex-mcp-client exocortex-node exocortex-worker; do
            install -m 0755 "$src/$bin" "$dest/$bin" 2>/dev/null || cp "$src/$bin" "$dest/$bin"
          done
          case ":$PATH:" in
            *":$dest:"*) ;;
            *) echo "note: add $dest to PATH" ;;
          esac
          echo "installed: exocortex, exocortex-mcp-client, exocortex-node, exocortex-worker"
          echo "next: exocortex --mode mcp-standalone --org my-org --user me"
          EOF
          chmod +x dist/install.sh
      - name: Create/attach release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Exocortex $TAG" --generate-notes || true
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/*tar.gz dist/*sha256 dist/install.sh --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: dist/install.sh
