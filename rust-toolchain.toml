# rust-toolchain.toml
# M0 deviation (recorded): PRD §2.3 pins 1.83.0, but every published release
# of `rmcp` (§2.2 pin, "0.1") is edition-2024 and requires Rust >= 1.85, and
# ctutils 0.4.4 (the RUSTSEC-2026-0385 security floor) requires >= 1.87.
# The pins cannot both hold; 1.87.0 is the minimum that satisfies the
# dependency set. Cargo's MSRV-aware resolver also unblocks transitive deps.
[toolchain]
channel = "1.87.0"
components = ["rustfmt", "clippy", "rust-src", "rust-analyzer"]
profile = "minimal"
