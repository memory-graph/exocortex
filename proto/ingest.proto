syntax = "proto3";
package exocortex.ingest.v1;

import "google/protobuf/timestamp.proto";

service IngestService {
  // Batched, validated write path. Idempotent by (producer_id, batch_id).
  rpc Submit(IngestBatch) returns (IngestAck);
  // Streaming variant for high-volume adapters. Each SubmitOne acks
  // independently; the server may reject individual batches without tearing
  // down the stream.
  rpc SubmitStream(stream SubmitOne) returns (stream SubmitAck);
  // Register a source and its visibility ceiling before the first Submit (R-I3).
  rpc RegisterSource(RegisterSourceRequest) returns (RegisterSourceResponse);
  // Fetch the currently accepted ontology fingerprint before submitting.
  rpc Fingerprint(FingerprintRequest) returns (FingerprintResponse);
  // D21-b (adapter-contract PRD D2): dry-run Submit. Runs the full
  // admission + validation path under the caller's own producer HMAC and
  // returns the verdicts a real submission would produce, committing
  // nothing — no LSN, no audit row, no idempotency claim, no cursor
  // movement. `assigned_lsn` is always 0; `similar_to` (computed at
  // commit) is always empty. A preflight does not consult the
  // idempotency registry: replay is a transport property, not a data
  // verdict, so preflighting an already-committed batch_id reports the
  // fresh verdicts.
  rpc Preflight(IngestBatch) returns (IngestAck);
  // D21-c (adapter-contract PRD D3): pull the rulebook as data. The
  // response carries the compiled validation manifest (JSON) and the
  // compatibility fingerprint it was stamped with. Pull-and-cache keyed
  // by fingerprint (PRD open question 2's recorded assumption): an
  // adapter re-pulls when the negotiated fingerprint moves; a manifest
  // that does not match the negotiated fingerprint is refused and the
  // adapter degrades to server-side validation with a warning.
  rpc GetValidationManifest(ManifestRequest) returns (ManifestResponse);
}

message ManifestRequest {
  string org_id      = 1;  // scopes the source lookup
  string source_uri  = 2;  // optional: name a registration to inline its ceiling
  string producer_id = 3;
}
message ManifestResponse {
  string manifest_json            = 1;  // the compiled rulebook (wire::manifest shape)
  bytes  compatibility_fingerprint = 2;  // 32 bytes; must equal the negotiated value
}

message RegisterSourceRequest {
  string     org_id        = 1;
  string     source_uri    = 2;
  string     producer_id   = 3;
  Visibility ceiling       = 4;  // requested; MUST NOT exceed the admin-configured value (§18.2 / audit WS2)
  string     source_flavor = 5;  // "session" | "iceberg" | "delta" | "parquet-dir" | "custom"
  ProducerIdentity producer = 6; // HMAC over the registration fields (R-I8 / audit WS1): an
                                 // unauthenticated RPC must not mutate the registry Submit depends on
  // D8 (agent-instructions PRD §3.8): the closed producer-kind enum. A
  // free string would persist typos into append-only provenance forever.
  // Registration rejects UNSPECIFIED — every producer must declare.
  ProducerKind producer_kind = 7;
  // D21-a (adapter-contract PRD §3.1): the declared projection — what
  // subset of the source this adapter is entitled to bring in, the field
  // mapping `mapping_version` versions, and the bounds that stop the
  // window instead of letting a table silently dominate the graph.
  // REQUIRED for table-shaped flavors ("iceberg" | "delta" |
  // "parquet-dir"); "session" and "custom" are exempt in v1 (the shipped
  // docs adapter migrates separately).
  ProjectionDescriptor projection = 8;
  // D24 (rights and consent provenance): the source's per-record
  // DEFAULT rights, stamped onto submitted memories that carry none
  // of their own. Producer-declared and visible in provenance; the
  // administrator source policy remains the enforcement point (the
  // WS2 ceiling pattern — a producer's self-declaration never widens
  // what policy allows).
  Rights default_rights = 9;
}
message ProjectionField {
  string source_field = 1; // column / key, in the source's own terms
  string memory_type = 2;  // ontology target type name
  string kind        = 3;  // relationship name, or "" when the field maps to attributes only
}
message SourceColumn {
  string name      = 1;
  string data_type = 2;   // source-declared type; a change under the same name is the dangerous case
}
message ProjectionBounds {
  uint64 max_rows_per_window = 1;  // rows one submit window may carry
  uint64 max_rows_per_run    = 2;  // rows one adapter run may bring, total
  uint32 max_graph_share_percent = 3; // share of the org graph this source may occupy (declared; Dreams-side evaluation is the recorded deferral)
}
message ProjectionDescriptor {
  string   selector = 1;             // what subset is in scope, in the source's own terms
  repeated ProjectionField fields = 2; // the artifact mapping_version versions
  repeated SourceColumn source_schema = 3; // columns at mapping time; the schema hash derives from this
  uint32   mapping_version = 4;
  ProjectionBounds bounds = 5;
  string   last_snapshot_id = 6;     // source snapshot the schema was observed at
}
message RegisterSourceResponse { Visibility ceiling = 1; }

message IngestBatch {
  string org_id                = 1;   // scopes identity derivation (R-T18a)
  string source_uri            = 2;   // "session://…" or "iceberg://…"
  string producer_id           = 3;   // registered producer
  string batch_id              = 4;   // producer-scoped monotonic id (idempotency key)
  string mapping_version       = 5;
  bytes  ontology_fingerprint  = 6;   // 32 bytes; kernel rejects on mismatch
  Visibility ceiling           = 7;   // MUST equal the registered value (R-I3)
  string checksum              = 8;   // hex; BLAKE3 over canonical serialization
  google.protobuf.Timestamp observed_at = 9;
  google.protobuf.Timestamp recorded_at = 10;
  ExternalSnapshotInfo snapshot = 11; // present iff producer is external-source (R-T16a)

  repeated MemoryDraft       memories      = 20;
  repeated RelationshipDraft relationships = 21;
  ProducerIdentity           producer      = 22;
}

message MemoryDraft {
  string draft_key   = 1;   // producer-local id; relationships link via draft keys
  string id          = 2;   // suggested ULID; final MemoryId assigned by the kernel
  string memory_type = 3;   // MUST resolve to a registered MemoryType
  string title       = 4;   // 1..=200 chars (R-T5)
  string content     = 5;   // free text; single-string payload (§7.5)
  repeated string tags = 6;
  Visibility visibility = 7;   // ≤ ceiling (R-T11a); required, no default (R-T6)
  google.protobuf.Timestamp valid_from  = 8;   // empty = recorded_at (R-T7)
  google.protobuf.Timestamp valid_until = 9;   // optional
  ExternalKey external_key = 10;  // required iff batch.snapshot present
  // D24: this record's rights and consent provenance. Absent = the
  // source's registered default applies; absent on both = the corpus
  // exporter answers "not covered" for this row (fail closed).
  Rights rights = 11;
}

// D24 (rights and consent provenance): whether a record may leave the
// org (train on, resell, republish) and under what basis. Every field
// is a claim an operator can verify against the audit ledger.
message Rights {
  string licence = 1;             // SPDX id or name; "" = unlicensed
  string consent_basis = 2;       // e.g. "contractual", "legitimate-interest"; "" = none claimed
  google.protobuf.Timestamp retention_until = 3;  // optional hard stop
  bool   redacted = 4;            // content already redacted by the producer
}

message RelationshipDraft {
  string from_draft_key = 1;
  string to_draft_key   = 2;
  string kind           = 3;   // MUST resolve to a registered RelKindId
  float  strength       = 4;   // 0.0..1.0; 0 = RelMeta default
  float  confidence     = 5;   // 0.0..1.0
  string context        = 6;
  Visibility visibility = 7;   // ≤ ceiling
  // §4.5 (agent-instructions PRD): cross-batch edge target — an EXISTING
  // memory by 32-hex id. Mutually exclusive with to_draft_key: exactly one
  // must be set. The server resolves the stored type and enforces R-T17
  // against the from-draft's type.
  string to_memory_id   = 8;
}

message ExternalSnapshotInfo {
  string snapshot_id   = 1;
  bytes  schema_hash   = 2;   // 32 bytes
  string source_flavor = 3;   // "iceberg" | "delta" | "parquet-dir" | "custom"
}

message ExternalKey {
  bytes  table_uuid      = 1;   // 16 bytes
  string logical_pk      = 2;
  uint32 mapping_version = 3;
}

enum Visibility {
  PRIVATE = 0;
  PROJECT = 1;
  TEAM    = 2;
  ORG     = 3;
  PUBLIC  = 4;   // reserved; v1 read paths treat as ORG (R-T11)
}

message ProducerIdentity {
  string node_id       = 1;
  string agent_id      = 2;   // optional; harness only
  string adapter_id    = 3;   // optional; adapter only
  bytes  hmac_signature= 4;   // over remainder of batch
  // §4.4 (agent-instructions PRD): optional producer telemetry. Logged and
  // counted (D9); zero behavior change. Old servers ignore it (proto3).
  ClientMetadata client_metadata = 5;
}

message ClientMetadata {
  string playbook_version = 1;  // D3 version string, e.g. "1.0.0"
  string client_version   = 2;  // exocortex-client semver
  string harness_hint     = 3;  // "claude-code" | "codex" | "cursor" | free
  string project_id       = 4;  // requested scope; server verifies principal membership
  string team_id          = 5;  // requested scope; server verifies principal membership
}

// D8: closed enum. UNSPECIFIED is rejected at registration; CUSTOM is the
// escape hatch; a genuinely new kind is one additive enum value.
enum ProducerKind {
  PRODUCER_KIND_UNSPECIFIED = 0;
  PRODUCER_KIND_CODING_AGENT   = 1;
  PRODUCER_KIND_RESEARCH_AGENT = 2;
  PRODUCER_KIND_DOCS_ADAPTER   = 3;
  PRODUCER_KIND_ANALYTICS_ADAPTER = 4;
  PRODUCER_KIND_CUSTOM         = 5;
  // D23 (master plan, LLM boundary decision, option a): an OUT-OF-PROCESS
  // extraction producer — extraction (LLM or otherwise) runs in an
  // adapter repo, never inside this node (R-D6/CR-19 unchanged and still
  // CI-enforced here). Its output arrives as typed drafts through this
  // same signed path, stamped with this kind so it is distinguishable in
  // provenance and filterable/revocable at query time. Additive: older
  // servers reject registrations carrying it (fail closed), which is the
  // correct rolling-upgrade behavior for a new producer class.
  PRODUCER_KIND_EXTRACTED      = 6;
  // D19 (master plan, SaaS-API adapter family): a SaaS-API adapter —
  // Linear/Jira/GitHub/ServiceNow transcribed deterministically through
  // this same signed path (relationships these systems already state
  // are transcribed, never inferred). One kind for the whole family so
  // its rows are distinguishable as a class in provenance and filterable
  // or revocable at query time. Additive like EXTRACTED: older servers
  // reject registrations carrying it (fail closed), which is the correct
  // rolling-upgrade behavior for a new producer class.
  PRODUCER_KIND_SAAS_ADAPTER = 7;
}

message IngestAck {
  string batch_id      = 1;
  uint32 accepted      = 2;
  uint32 rejected      = 3;
  repeated RejectRow rejections = 4;
  uint64 assigned_lsn  = 5;
  // §4.10b (agent-instructions PRD): advisory near-duplicate hints computed
  // deterministically (embedding cosine) at commit. Non-blocking — the
  // batch proceeds regardless; the producer decides whether to supersede.
  repeated SimilarToHint similar_to = 6;
}
message RejectRow {
  string draft_key  = 1;   // producer-local, for triage
  RejectCode code   = 2;
  string detail     = 3;
}
message SimilarToHint {
  string draft_key           = 1;  // the draft in THIS batch
  string existing_memory_id  = 2;  // 32-hex id of the near neighbor
  string existing_title      = 3;
  // "replaces" (near-duplicate, same type), "contradicts" (near-duplicate,
  // different type), "duplicate" (exact content match — the batch still
  // committed; backend dedup handles byte-identical replays only).
  string suggestion          = 4;
}
enum RejectCode {
  UNKNOWN               = 0;
  INCOMPATIBLE_ONTOLOGY = 1;   // fingerprint mismatch
  UNKNOWN_SOURCE        = 2;   // producer_id not registered, or ceiling mismatch (R-I3)
  UNKNOWN_MEMORY_TYPE   = 3;
  UNKNOWN_KIND          = 4;
  INVALID_TYPE_TRIPLE   = 5;   // R-T17
  VISIBILITY_WIDENING   = 6;   // R-T11a
  MISSING_EXTERNAL_KEY  = 7;   // external batch without ExternalKey
  DUPLICATE_BATCH       = 8;   // batch_id already committed (idempotent replay)
  BAD_CHECKSUM          = 9;
  UNAUTHORIZED          = 10;  // HMAC missing/invalid
  RATE_LIMITED          = 11;
  // R-T14: computed-only kinds (SimilarTo) are produced exclusively by the
  // Dreams cycle; a producer asserting one directly is rejected.
  COMPUTED_KIND_REJECTED = 12;
  // B8/B9: malformed external-source coordinates — table_uuid must be 16
  // bytes (§18.6), snapshot schema_hash must be 32 (§18.6). Rejected
  // rather than lossy-coerced.
  INVALID_EXTERNAL_KEY = 13;
  RESOURCE_LIMIT_EXCEEDED = 14; // fixed request/content/tag/edge ceilings
  // D21-d (adapter-contract PRD §3.4): the source was rewound — snapshot
  // rollback, slot reset. The cursor is monotonic and the source is not;
  // this needs an operator, not a retry.
  SOURCE_REWOUND = 15;
  // D21-d: the batch's snapshot schema_hash differs from the schema the
  // mapping was registered against. Every row fails closed until the
  // projection is deliberately re-registered with a mapping_version bump.
  SCHEMA_DRIFT = 16;
  // D21-a: the submission exceeds a declared projection bound (rows per
  // window). The window stops; it is never truncated silently.
  PROJECTION_BOUND_EXCEEDED = 17;
}
message SubmitOne { oneof body { IngestBatch batch = 1; } }
message SubmitAck { IngestAck ack = 1; }
message FingerprintRequest {}
message FingerprintResponse { bytes fingerprint = 1; string kernel_version = 2; repeated string packs = 3; }
